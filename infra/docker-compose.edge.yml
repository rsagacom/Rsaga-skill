# Optional production HTTPS edge. Use together with docker-compose.yml:
# docker compose --env-file infra/.env -f infra/docker-compose.yml \
#   -f infra/docker-compose.edge.yml up --build -d
#
# This overlay is intentionally separate so deployments using a managed
# ingress (Cloudflare, ALB, Nginx, etc.) can keep the base stack unchanged.
services:
  edge:
    image: ${CADDY_IMAGE:-caddy:2.11.4-alpine}
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    environment:
      STUDIO_PUBLIC_HOST: ${STUDIO_PUBLIC_HOST:?STUDIO_PUBLIC_HOST is required for the edge overlay}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required for the edge overlay}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - manhua-caddy-data:/data
      - manhua-caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:8080/_edge_health && wget -qO /dev/null http://127.0.0.1:8080/_edge_api_health && wget -qO /dev/null http://127.0.0.1:8080/_edge_web_health"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 6

volumes:
  manhua-caddy-data:
  manhua-caddy-config:
